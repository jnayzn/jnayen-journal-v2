name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradej
          POSTGRES_PASSWORD: tradej
          POSTGRES_DB: tradej
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradej"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://tradej:tradej@localhost:5432/tradej
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Drizzle schema
        run: pnpm db:push

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Seed demo data
        run: pnpm seed
